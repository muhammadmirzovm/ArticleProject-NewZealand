{% extends "base.html" %}
<!--  -->
{% load crispy_forms_tags %}
<!--  -->
{% block title %}Article Form{% endblock %}
<!--  -->
{% block content %}
<div class="col-6 mx-auto">
  <h1 class="text-center">Maqola qo'shish</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <!--  -->
    {{ form|crispy }}
    <button class="btn btn-secondary me-3" type="submit">Saqlash</button>
    <a class="btn btn-outline-secondary" href="{% url 'article_list' %}">Orqaga</a>
  </form>
</div>
{% endblock %}
